  # Finding 9. These were ONE group, with "zinc plated steel" as an alias of hot-dip galvanised and
  # a caveat explaining that the two are different coatings. The caveat mechanism only annotates --
  # it never reaches the verdict -- so the comparator returned a flat semantic equivalence and the
  # difference travelled through the pipeline invisibly. A coating that lasts 5-25 microns' worth of
  # service being silently equated with one that lasts 45-85 is a corrosion-performance defect, and
  # it is the one class of error this product exists to catch. Split into two sibling groups sharing
  # the `coating` facet, so they compare and disagree.
  - id: steel/coating/hot_dip_galvanised
    canonical: "Hot-dip galvanised steel"
    broader: [steel]
    facet: coating
    source: "ISO 1461 (hot dip galvanized coatings on fabricated iron and steel articles)"
    aliases: ["galvanised steel", "galvanized steel", "HDG", "hot dip galvanised", "hot-dip galvanised", "hot dip galvanized", "hot-dip galvanized"]

  - id: steel/coating/zinc_electroplated
    canonical: "Zinc-electroplated steel"
    broader: [steel]
    facet: coating
    source: "ISO 4042 (fasteners -- electroplated coating systems); ASTM B633"
    aliases: ["zinc plated steel", "zinc-plated steel", "zinc plated", "zinc-plated", "electroplated zinc", "zinc electroplated", "electro-galvanised", "electro-galvanized", "electrogalvanised", "electrogalvanized"]

