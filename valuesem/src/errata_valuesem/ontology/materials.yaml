# Material equivalence classes.
#
# Every group here is a claim that a set of designations name one material. Each carries a `source`
# naming the standard that makes the equivalence true, because an equivalence without a citation is
# an opinion, and this library's whole job is to not have opinions.
#
# Contributing: one group, its aliases, its source, and a fixture pair in
# bench/suites/equivalence/. That is the smallest useful PR to this repository (§9.4).

version: "materials/1.1.0"

groups:
  # --- Austenitic stainless steels ------------------------------------------------------------
  - id: steel/stainless/304
    canonical: "AISI 304 austenitic stainless steel"
    broader: [steel/stainless, steel]
    source: "EN 10088-1 (1.4301); ASTM A240; ISO 3506-1 (A2); JIS G4303 (SUS304)"
    aliases:
      - "304"
      - "304 SS"
      - "SS 304"
      - "SS304"
      - "304SS"
      - "AISI 304"
      - "type 304"
      - "1.4301"
      - "X5CrNi18-10"
      - "SUS304"
      - "S30400"
      - "UNS S30400"
      - "18/8"
      - "18-8"
      - "A2"
      - "A2-70"
      - "A2-80"
    caveats:
      A2: >-
        A2 is the ISO 3506 fastener property-class group covering the 304 family (304, 304L,
        321, 347). The equivalence holds for fastener material callouts; for wrought product
        it under-specifies the grade.
      "18/8": >-
        18/8 and 18-8 are trade names for the 18% Cr / 8% Ni austenitic family and are used
        loosely for 302, 304 and 305.

  - id: steel/stainless/304L
    canonical: "AISI 304L low-carbon austenitic stainless steel"
    broader: [steel/stainless/304, steel/stainless, steel]
    source: "EN 10088-1 (1.4307); ASTM A240"
    aliases: ["304L", "304 L", "SS 304L", "1.4307", "1.4306", "X2CrNi18-9", "S30403", "UNS S30403"]

  - id: steel/stainless/316
    canonical: "AISI 316 molybdenum-bearing austenitic stainless steel"
    broader: [steel/stainless, steel]
    source: "EN 10088-1 (1.4401); ASTM A240; ISO 3506-1 (A4); JIS G4303 (SUS316)"
    aliases:
      - "316"
      - "316 SS"
      - "SS 316"
      - "SS316"
      - "316SS"
      - "AISI 316"
      - "type 316"
      - "1.4401"
      - "X5CrNiMo17-12-2"
      - "SUS316"
      - "S31600"
      - "UNS S31600"
      - "A4"
      - "A4-70"
      - "A4-80"
      - "marine grade stainless"
    caveats:
      A4: >-
        A4 is the ISO 3506 fastener property-class group covering the 316 family (316, 316L,
        316Ti). The equivalence holds for fastener material callouts; for wrought product it
        under-specifies the grade.
      "marine grade stainless": >-
        A trade description, not a standard designation. Commonly 316/316L but occasionally
        used for duplex grades.

  # Finding 10. 1.4404 and 1.4435 were two ALIASES OF ONE GROUP, so the comparator called them a
  # flat equivalence. They are different EN grades with different specified envelopes -- 1.4404 is
  # Ni 10.0-13.0 / Mo 2.0-2.5, 1.4435 is Ni 12.5-15.0 / Mo 2.5-3.0 (EN 10088; verified 2026-08-19
  # via SteelNumber and mill datasheets). The Mo bands do not nest: a bar meeting 1.4435 at Mo 2.8
  # fails 1.4404's ceiling. Modelled as two children of the 316L family so that "316L" against
  # either is still granularity, while the two grades against each other disagree.
  - id: steel/stainless/316L
    canonical: "AISI 316L low-carbon molybdenum-bearing austenitic stainless steel"
    broader: [steel/stainless/316, steel/stainless, steel]
    source: "EN 10088-1; ASTM A240"
    aliases: ["316L", "316 L", "SS 316L", "S31603", "UNS S31603", "SUS316L"]

  - id: steel/stainless/316L/1.4404
    canonical: "EN 1.4404 (X2CrNiMo17-12-2) low-carbon molybdenum-bearing austenitic stainless steel"
    broader: [steel/stainless/316L, steel/stainless/316, steel/stainless, steel]
    source: "EN 10088-1/-2/-3: 1.4404, Cr 16.5-18.5, Ni 10.0-13.0, Mo 2.00-2.50"
    aliases: ["1.4404", "X2CrNiMo17-12-2"]

  - id: steel/stainless/316L/1.4435
    canonical: "EN 1.4435 (X2CrNiMo18-14-3) high-molybdenum low-ferrite austenitic stainless steel"
    broader: [steel/stainless/316L, steel/stainless/316, steel/stainless, steel]
    source: "EN 10088-1/-2/-3: 1.4435, Cr 17.0-19.0, Ni 12.5-15.0, Mo 2.50-3.00"
    aliases: ["1.4435", "X2CrNiMo18-14-3"]

  - id: steel/stainless/321
    canonical: "AISI 321 titanium-stabilised austenitic stainless steel"
    broader: [steel/stainless, steel]
    source: "EN 10088-1 (1.4541); ASTM A240"
    aliases: ["321", "321 SS", "1.4541", "X6CrNiTi18-10", "S32100"]

