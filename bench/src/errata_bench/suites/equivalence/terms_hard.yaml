# Adversarial equivalence suite -- 'terms' family (FR-0.1/0.2 red-team pass).
#
# terms.yaml (30 cases) passes 100%. This file exists because a suite written by the same author as
# the comparator encodes the same blind spots twice, and the harness says so out loud. Every case
# here was chosen because it is either:
#
#   (a) a real trap in the ontology's own alias data -- word-order and cross-vocabulary collisions
#       that a naive string match would get wrong, tested to confirm the comparator declines rather
#       than guesses, or
#   (b) a real coverage gap -- a controlled-vocabulary axis (device category: MCB/RCBO/RCCB; the
#       reversed "Z characteristic"/"K characteristic" alias forms; the boolean-vs-nullish schema
#       boundary) that the ontology or the suite's own 6-label taxonomy does not yet represent, so
#       the comparator abstains where a domain reviewer would not.
#
# Do not read a PASS on every case here as success: several sections are deliberately built to
# fail, and the failures are the deliverable. See the harness report for which.

suite: equivalence
family: terms
version: "0.1.0"

cases:
  # ================================================================================================
  # 1. Tripping characteristic -- notation variants (attribute: tripping_characteristic / trip_curve)
  # ================================================================================================
  - id: trm-h001
    attribute: { key: tripping_characteristic, label: Tripping characteristic, kinds: [term], vocabulary: trip_curve }
    a: "Type C"
    b: "C-curve"
    expect: equivalent
    source: "IEC 60898-1 tripping characteristic C; hyphenated spelling folds to the registered 'C curve' alias"

  - id: trm-h002
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "TYPE C"
    b: "c curve"
    expect: equivalent
    source: "IEC 60898-1; all-caps and lower-case fold to the same alias key"

  - id: trm-h003
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "Char.C"
    b: "Characteristic C"
    expect: equivalent
    source: "IEC 60898-1; 'Char.C' with no space is the same alias key as the registered 'char. C'"

  - id: trm-h004
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "tripping characteristic B"
    b: "B"
    expect: equivalent
    source: "IEC 60898-1 tripping characteristic B"

  - id: trm-h005
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "Type  D"
    b: "D curve"
    expect: equivalent
    source: "IEC 60898-1; double internal space, a common OCR/export artefact"

  - id: trm-h006
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "type K"
    b: "K characteristic"
    expect: equivalent
    source: "IEC 60947-2 K curve (motor-protection characteristic)"
    rationale: >-
      A real ontology gap, not a notation stretch. The B/C/D terms each register both word orders
      ("characteristic B" and "B characteristic"); K and Z register only "characteristic K" /
      "characteristic Z" and not the reversed form. "K characteristic" and "characteristic K" mean
      the same thing to any reader; predict the comparator declines this one on a missing alias.

  - id: trm-h007
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "type Z"
    b: "Z characteristic"
    expect: equivalent
    source: "IEC 60947-2 Z curve (semiconductor-protection characteristic)"
    rationale: >-
      The same asymmetric-alias gap as trm-h006, on the Z curve. "characteristic Z" is registered;
      "Z characteristic" is not, even though B/C/D register both orders.

  - id: trm-h008
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "MA curve"
    b: "type MA"
    expect: equivalent
    source: "IEC 60947-2 MA characteristic (magnetic-only, no integral thermal element)"

  # ================================================================================================
  # 2. Tripping characteristic -- genuine contradictions (different instantaneous trip bands)
  # ================================================================================================
  - id: trm-h009
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "Type B"
    b: "Type D"
    expect: contradiction
    source: "IEC 60898-1: B trips at 3-5x In, D at 10-20x In -- disjoint instantaneous bands"

  - id: trm-h010
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "B curve"
    b: "D curve"
    expect: contradiction
    source: "IEC 60898-1"

  - id: trm-h011
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "C"
    b: "K"
    expect: contradiction
    source: "IEC 60898-1 general-purpose C curve against the IEC 60947-2 motor-protection K curve"

  - id: trm-h012
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "D"
    b: "Z"
    expect: contradiction
    source: >-
      IEC 60898-1 D characteristic (high-inrush, 10-20x In) against the IEC 60947-2 Z characteristic
      (semiconductor protection, 2-3x In per manufacturer trip-curve literature). Corrected: the
      earlier text attributed both curves to IEC 60947-2; D is an IEC 60898-1 curve.

  - id: trm-h013
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "MA"
    b: "C"
    expect: contradiction
    source: "IEC 60947-2: MA is magnetic-only with no integral thermal element, unlike the thermal-magnetic C curve"

  - id: trm-h014
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "K"
    b: "MA"
    expect: contradiction
    source: "IEC 60947-2: K retains a thermal element for motor overload duty; MA does not"

  - id: trm-h015
    attribute: { key: tripping_characteristic, kinds: [term], vocabulary: trip_curve }
    a: "Type B"
    b: "Type C"
    expect: contradiction
    source: "IEC 60898-1: 3-5 In against 5-10 In instantaneous trip band"

  # ================================================================================================
  # 3. THE TRAP -- RCD "Type B" against trip-curve "B", unspecified attribute.
  #
  # "Type B" is a listed value of BOTH trip_curve and rcd_type (IEC 60898-1 curve vs IEC 62423 RCD
  # class -- unrelated classifications sharing a letter). Without a named vocabulary the parser must
  # refuse rather than guess. This is the single highest-value trap in this file: a comparator that
  # silently equates these on string similarity would be manufacturing a safety-relevant fact.
  # ================================================================================================
  - id: trm-h016
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "Type B"
    b: "B curve"
    expect: undetermined
    source: "'Type B' is claimed by both trip_curve/B (IEC 60898-1) and rcd_type/B (IEC 62423); 'B curve' is claimed only by trip_curve/B"
    rationale: >-
      The catalog side is genuinely ambiguous between a trip curve and an RCD classification; the
      evidence side happens to be unambiguous. The correct behaviour is still to decline, because the
      catalog claim was never resolved -- an evidence-side answer does not retroactively disambiguate
      what the catalog meant. Confirms the comparator does not silently letter-match "B" to "B".

  - id: trm-h017
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "B curve"
    b: "Type B"
    expect: undetermined
    source: "Same trap as trm-h016, catalog and evidence sides swapped"
    rationale: "Order should not matter to a refusal; if it does, that is itself a defect."

  - id: trm-h018
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "TYPE B"
    b: "B curve"
    expect: undetermined
    source: "Case folding does not remove the trip_curve/rcd_type collision on 'type B'"

  - id: trm-h019
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "Type B"
    b: "RCD type B"
    expect: undetermined
    source: "The catalog term is still ambiguous even though 'RCD type B' alone is not"
    rationale: >-
      "RCD type B" unambiguously names rcd_type/B on its own. But the catalog side, "Type B", is
      still claimed by two vocabularies, and the comparator has no way to know the evidence phrasing
      is meant to disambiguate it rather than merely restate it. Decline is still correct.

  - id: trm-h020
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "B"
    b: "Type B"
    expect: undetermined
    source: "Bare 'B' is unambiguous (trip_curve only); 'Type B' is not -- one refusal still forces abstention"

  - id: trm-h021
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "B curve"
    b: "Char. B"
    expect: equivalent
    source: "IEC 60898-1; neither 'B curve' nor 'Char. B' collides with the RCD vocabulary"
    rationale: >-
      The control case for trm-h016..020: when the surface forms are NOT the colliding "type B"
      alias, unspecified-attribute resolution works fine and reaches the same term unambiguously.
      This proves the refusals above are the trap being caught, not a parser that can never resolve
      anything without a named vocabulary.

  - id: trm-h022
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "type B"
    b: "TYPE B"
    expect: undetermined
    source: "Case-insensitive restatement of the trip_curve/rcd_type collision on 'type B'"

  - id: trm-h023
    attribute: { key: unspecified_attribute, kinds: [term] }
    a: "type B"
    b: "B type"
    expect: undetermined
    source: "'type B' collides across vocabularies; 'B type' (word order swapped) is unambiguous, claimed only by rcd_type/B"
    rationale: >-
      A second-order version of the trap: word order changes which vocabulary would even claim the
      string, but the catalog side is still ambiguous, so the pair as a whole must still decline.

  # ================================================================================================
  # 4. RCD type -- named vocabulary (attribute: rcd_type / rcd_type). The counterpart to section 3:
  #    same "Type B" family of strings, but now the attribute names the vocabulary, so resolution is
  #    available and the comparator should stop declining.
  # ================================================================================================
  - id: trm-h024
    attribute: { key: rcd_type, label: RCD type, kinds: [term], vocabulary: rcd_type }
    a: "Type B"
    b: "Type B"
    expect: equivalent
    source: "IEC 62423; naming the vocabulary is what makes 'Type B' resolvable"

  - id: trm-h025
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "Type A"
    b: "Type F"
    expect: contradiction
    source: "IEC 62423: Type F additionally detects specific composite/mixed-frequency residual currents that Type A does not; distinct classifications"

  - id: trm-h026
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "Type F"
    b: "Type B"
    expect: contradiction
    source: "IEC 62423: Type B additionally detects smooth DC residual current that Type F does not"

  - id: trm-h027
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "Type AC"
    b: "Type F"
    expect: contradiction
    source: >-
      IEC 61008-1/61009-1 define Type AC (sinusoidal AC residual current only); IEC 62423 defines
      Type F, which detects strictly more waveforms. Different classifications.

  - id: trm-h028
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "RCD type A"
    b: "A type"
    expect: equivalent
    source: "IEC 62423 spelling variants of Type A"

  - id: trm-h029
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "B+ type"
    b: "Type B+"
    expect: equivalent
    source: >-
      DIN VDE 0664-400 ("RCCB Type B+") spelling variants of Type B+. Corrected: the earlier text
      also cited IEC 62423, which specifies Type F and Type B only -- B+ is a German national
      extension beyond IEC/EN 62423, not an IEC type.

  - id: trm-h030
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "Type B+"
    b: "Type A"
    expect: contradiction
    source: >-
      DIN VDE 0664-400 (Type B+, a German national extension) against IEC 62423 / IEC 61008-1
      (Type A). Corrected: the earlier text attributed Type B+ jointly to IEC 62423, which does not
      define it.

  - id: trm-h031
    attribute: { key: rcd_type, kinds: [term], vocabulary: rcd_type }
    a: "AC type"
    b: "Type F"
    expect: contradiction
    source: "IEC 62423"

  # ================================================================================================
  # 5. Pole count -- spelling and abbreviation equivalences (attribute: number_of_poles / poles)
  # ================================================================================================
  - id: trm-h032
    attribute: { key: number_of_poles, label: Number of poles, kinds: [term], vocabulary: poles }
    a: "1-pole"
    b: "unipolar"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h033
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "four pole"
    b: "FP"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h034
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "2 pole"
    b: "double pole"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
