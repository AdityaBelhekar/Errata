  - id: trm-h035
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "bipolar"
    b: "DP"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h036
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "SPN"
    b: "single pole and neutral"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h037
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "TPN"
    b: "three pole and neutral"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h038
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "triple pole"
    b: "3 P"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  # ================================================================================================
  # 6. Pole count -- contradictions, including the confusable-alias trap ("TPN 1" vs "TPN")
  # ================================================================================================
  - id: trm-h039
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "Double pole"
    b: "1P+N"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact. Note also that UK consumer-unit
      literature routinely calls a 1P+N (switched-neutral) device "double pole", so the contradiction
      label here rests on the strict reading (DP = two protected poles) rather than on universal trade
      usage.

  - id: trm-h040
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "DP"
    b: "SPN"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h041
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "bipolar"
    b: "single pole and neutral"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h042
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "1P"
    b: "1P+N"
    expect: contradiction
    source: "IEC 60947-1: a bare 1P device has no switched or dedicated neutral path at all; 1P+N does"

  - id: trm-h043
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "SP"
    b: "SPN"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h044
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "3P"
    b: "4P"
    expect: contradiction
    source: "IEC 60947-1"

  - id: trm-h045
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "TP"
    b: "FP"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact.

  - id: trm-h046
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "4P"
    b: "1P+N"
    expect: contradiction
    source: "IEC 60947-1"

  - id: trm-h047
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "2P"
    b: "3P"
    expect: contradiction
    source: "IEC 60947-1"

  - id: trm-h048
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "TPN 1"
    b: "TPN"
    expect: contradiction
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-1 defines "pole", "single-pole device" and "multipole
      device" and the neutral pole, but it does NOT define the trade abbreviations SP/DP/TP/FP/SPN/TPN
      or the words unipolar/bipolar/triple pole/four pole. Those are UK and general electrical-trade
      conventions, documented only in wholesaler and vendor literature. The earlier bare citation "IEC
      60947-1" presented a trade convention as a standards fact. The "TPN 1 = 1P+N, bare TPN = 3P+N"
      split is this repo's own ontology alias table, not an IEC designation.
    rationale: >-
      A one-token trap drawn from the ontology's own alias data: "TPN 1" and "TPN" differ by a
      trailing digit that is trivially mistyped or misread on a datasheet, and they name completely
      different pole configurations in this vocabulary. If the comparator ever starts doing
      prefix/fuzzy matching on pole-count strings, this is the case that will silently call it
      equivalent instead of a contradiction.

  # ================================================================================================
  # 7. Pole count -- "2P+N" is not a registered term. Refuse, do not guess a nearest neighbour.
  # ================================================================================================
  - id: trm-h049
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "2P+N"
    b: "2P + N"
    expect: undetermined
    source: "The poles vocabulary (IEC 60947-1 designations) lists 1P/2P/3P/4P/1P+N/3P+N only; '2P+N' is not a listed term"
    rationale: >-
      Both sides use the identical unregistered designation. Constrained decoding must refuse rather
      than silently coerce it to the nearest listed value (2P, or 3P+N) -- a fabricated reading here
      would be exactly the "invent a fact" failure mode the project's own law forbids.

  - id: trm-h050
    attribute: { key: number_of_poles, kinds: [term], vocabulary: poles }
    a: "2P+N"
    b: "3P+N"
    expect: undetermined
    source: "'2P+N' is not a listed value of the poles vocabulary; the catalog side must refuse before any comparison is possible"

  # ================================================================================================
  # 8. Mounting and connection -- adversarial spelling and genuine contradictions
  # ================================================================================================
  - id: trm-h051
    attribute: { key: mounting_method, label: Mounting, kinds: [term], vocabulary: mounting }
    a: "35mm DIN rail"
    b: "top hat rail"
    expect: equivalent
    source: "IEC 60715 top-hat rail, 35 mm"

  - id: trm-h052
    attribute: { key: mounting_method, kinds: [term], vocabulary: mounting }
    a: "DIN-rail"
    b: "DIN 35"
    expect: equivalent
    source: "IEC 60715"

  - id: trm-h053
    attribute: { key: mounting_method, kinds: [term], vocabulary: mounting }
    a: "Flush mount"
    b: "Surface mount"
    expect: contradiction
    source: "Mutually exclusive installation methods: recessed into the wall against applied on top of it"

  - id: trm-h054
    attribute: { key: mounting_method, kinds: [term], vocabulary: mounting }
    a: "recessed"
    b: "panel mount"
    expect: contradiction
    source: "Flush/recessed and panel-applied are different mounting provisions"

  - id: trm-h055
    attribute: { key: connection_method, label: Connection, kinds: [term], vocabulary: connection }
    a: "Screw terminal"
    b: "Plug-in"
    expect: contradiction
    source: "IEC 60947-7-1: fixed screw-clamp connection against a pluggable connector; different termination technologies"

  - id: trm-h056
    attribute: { key: connection_method, kinds: [term], vocabulary: connection }
    a: "cage clamp"
    b: "push in terminal"
    expect: equivalent
    source: >-
      [UNVERIFIED - needs checking] IEC 60947-7-1 covers terminal blocks but does not declare these
      two trade terms interchangeable. WAGO -- who coined CAGE CLAMP -- market "Push-in CAGE CLAMP"
      as a distinct product family from CAGE CLAMP (push-in accepts a rigid conductor with no tool;
      a plain cage clamp must be opened with a lever or screwdriver). Both are spring-clamp family;
      whether that makes them one connection method or two is the open question.
    rationale: >-
      LABEL DISPUTED AND DELIBERATELY UNCHANGED -- P1 task 1.5, 2026-08-19. Escalated to the
      independent dual-labelling packet (FR-0.1) rather than decided here.
      .
      The sibling finding mat-h063 was resolved in the same pass because its evidence was decisive
      and the repo already labelled the identical relationship elsewhere. This one is not the same
      shape, for two reasons.
      .
      First, the evidence is manufacturer marketing, not a standard. IEC 60947-7-1 is silent, and a
      vendor's product-family boundary is a commercial fact that other vendors need not share.
      .
      Second, and decisively: acting on it means editing the ONTOLOGY, not the label.
      ontology/terms.yaml holds "cage clamp" and "push in terminal" as aliases of one term,
      connection/spring. Splitting that alias changes how every spring-family pair in the suite
      resolves, not just this case. That is a comparator change dressed as a label change, and
      ground rule 7 wants negative controls and evidence before one of those, which this does not
      yet have.
      .
      The precedent for holding is ELCB (finding 13): left unregistered because three live readings
      existed and the surface form could not pick between them. Same situation, same answer --
      record the ambiguity, do not resolve it to make a number move.

  - id: trm-h057
    attribute: { key: connection_method, kinds: [term], vocabulary: connection }
    a: "screw clamp"
    b: "pluggable"
    expect: contradiction
    source: "IEC 60947-7-1"

