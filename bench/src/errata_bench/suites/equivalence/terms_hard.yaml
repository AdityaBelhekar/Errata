  # ================================================================================================
  # 10. Device category -- MCB / RCBO / RCCB / "Circuit breaker". The ontology currently registers
  #     NO vocabulary at all for device category. Every case below is predicted to abstain
  #     (UNEXPECTED_ABSTENTION) rather than raise the finding a domain reviewer would raise. This is
  #     the single largest real gap this file found: three devices with materially different
  #     protection functions, and a catalog that mislabels one as another is exactly the "fire, a
  #     lawsuit, a terminated contract" scenario the project exists to catch -- and today the
  #     comparator says nothing about it at all.
  # ================================================================================================
  - id: trm-h062
    attribute: { key: device_category, label: Device category, kinds: [term] }
    a: "MCB"
    b: "RCBO"
    expect: contradiction
    source: "IEC 60898-1 MCB (overcurrent protection only) against IEC 61009-1 RCBO (overcurrent + residual-current protection); not interchangeable devices"
    rationale: >-
      No device-category vocabulary exists in the ontology, so this is predicted to decline
      (UNEXPECTED_ABSTENTION) rather than raise the severe, safety-relevant contradiction a reviewer
      would. Flagged as the highest-value coverage gap found in this pass.

  - id: trm-h063
    attribute: { key: device_category, kinds: [term] }
    a: "RCBO"
    b: "RCCB"
    expect: contradiction
    source: "IEC 61009-1 RCBO adds integral overcurrent protection that IEC 61008-1 RCCB lacks"
    rationale: "Predicted to decline for the same reason as trm-h062: no device-category vocabulary."

  - id: trm-h064
    attribute: { key: device_category, kinds: [term] }
    a: "MCB"
    b: "RCCB"
    expect: contradiction
    source: "IEC 60898-1 (overcurrent only) against IEC 61008-1 (residual current only): neither function overlaps the other"
    rationale: "Predicted to decline; no device-category vocabulary."

  - id: trm-h065
    attribute: { key: device_category, kinds: [term] }
    a: "RCCB"
    b: "RCBO"
    expect: contradiction
    source: "IEC 61008-1 against IEC 61009-1"
    rationale: "Order-flipped restatement of trm-h063; predicted to decline the same way."

  - id: trm-h066
    attribute: { key: device_category, kinds: [term] }
    a: "RCBO"
    b: "MCB"
    expect: contradiction
    source: "IEC 61009-1 against IEC 60898-1"
    rationale: "Order-flipped restatement of trm-h062; predicted to decline the same way."

  - id: trm-h067
    attribute: { key: device_category, kinds: [term] }
    a: "MCB"
    b: "Miniature circuit breaker"
    expect: equivalent
    source: "IEC 60898-1: MCB is the standard abbreviation of miniature circuit-breaker"
    rationale: >-
      The plainest possible equivalence in this cluster -- an abbreviation and its full expansion --
      and it is still predicted to decline, because the ontology has no device-category vocabulary
      to resolve either string against.

  - id: trm-h068
    attribute: { key: device_category, kinds: [term] }
    a: "RCBO"
    b: "Residual current circuit breaker with overcurrent protection"
    expect: equivalent
    source: "IEC 61009-1: RCBO = Residual Current operated Circuit-Breaker with integral Overcurrent protection"
    rationale: "Predicted to decline for the same reason as trm-h067."

  - id: trm-h069
    attribute: { key: device_category, kinds: [term] }
    a: "RCCB"
    b: "RCD without overcurrent protection"
    expect: equivalent
    source: "IEC 61008-1: RCCB = Residual Current operated Circuit-Breaker without integral overcurrent protection"
    rationale: "Predicted to decline for the same reason as trm-h067."

  - id: trm-h070
    attribute: { key: device_category, kinds: [term] }
    a: "Circuit breaker"
    b: "MCB"
    expect: granularity
    source: "IEC 60898-1: MCB is a specific overcurrent-protection device; 'circuit breaker' is the generic category"
    rationale: >-
      Under-specified, not wrong -- the catalog textbook case for granularity. Predicted to decline
      anyway, because neither string is registered anywhere in the ontology (there is no generic
      'circuit breaker' term the way there is a generic 'Threaded' or 'Stainless steel').

  - id: trm-h071
    attribute: { key: device_category, kinds: [term] }
    a: "Circuit breaker"
    b: "RCBO"
    expect: granularity
    expect_alternatives: [undetermined]
    source: "IEC 61009-1 defines an RCBO as a residual-current-operated circuit-breaker with integral overcurrent protection -- it IS a circuit breaker by the standard's own name"
    rationale: >-
      Deliberately debatable, as the brief asks for. 'Circuit breaker' genuinely subsumes RCBO by the
      standard's own definition, which argues for granularity; but the residual-current function is
      real added capability an RCBO carries that a bare MCB does not, which argues a strict reviewer
      could reasonably decline rather than call it merely "less specific". expect_alternatives
      records both readings as defensible. Note this also happens to be the label the comparator's
      actual (abstaining) behaviour satisfies, since undetermined is included as an accepted reading.

  - id: trm-h072
    attribute: { key: device_category, kinds: [term] }
    a: "Circuit breaker"
    b: "RCCB"
    expect: granularity
    expect_alternatives: [undetermined]
    source: "IEC 61008-1 defines an RCCB as a residual-current-operated circuit-breaker without integral overcurrent protection -- also literally a circuit breaker by the standard's own name"
    rationale: "Same debate as trm-h071, on RCCB instead of RCBO."

  # ================================================================================================
  # 11. Boolean -- the nullish-placeholder trap. "-" / "N/A" / "TBD" must never be read as a stated
  #     "No"; the correct behaviour is to treat the field as blank. This is caught upstream of the
  #     boolean grammar entirely (errata_comparator._is_present / errata_valuesem NULLISH), so these
  #     never reach RefusalReason.EMPTY inside the term/boolean parser -- they short-circuit to a
  #     catalog-blank / evidence-unsupported finding instead of an UNDETERMINED decline. That is
  #     arguably correct product behaviour (a blank field is informative), but it is NOT one of the
  #     six labels this suite's taxonomy can express, so every case below is predicted to disagree
  #     with 'undetermined' under the current scoring even though the underlying behaviour -- never
  #     inventing a false "No" -- is exactly right.
  # ================================================================================================
  - id: trm-h073
    attribute: { key: rohs_compliant, label: RoHS compliant, kinds: [boolean] }
    a: "N/A"
    b: "Yes"
    expect: null_gap
    source: "'N/A' is a NULLISH placeholder (errata_valuesem.canonical.NULLISH), not a stated boolean value, and must not be read as a false 'No'"
    rationale: >-
      Predicted to score as a disagreement under this suite's 6-label taxonomy: the catalog side is
      caught by the NULLISH pre-filter before the boolean grammar ever runs, producing
      CATALOG_NULL_EVIDENCE_PRESENT (a real, SEV2 finding) rather than UNDETERMINED. The comparator
      does NOT invent a false "No" -- that part is correct and worth confirming -- but this suite has
      no label for "one side is blank", so the case cannot pass as written. A taxonomy gap, not a
      code bug.

  - id: trm-h074
    attribute: { key: rohs_compliant, kinds: [boolean] }
    a: "TBD"
    b: "No"
    expect: null_gap
    source: "'TBD' is a NULLISH placeholder, not a stated 'No'"
    rationale: "Same taxonomy gap as trm-h073."

  - id: trm-h075
    attribute: { key: rohs_compliant, kinds: [boolean] }
    a: "Yes"
    b: "-"
    expect: null_gap
    source: "'-' is a NULLISH placeholder; a stated catalog claim with unsupported evidence is not the same as a contradiction"
    rationale: >-
      Mirror of trm-h073 with the nullish side on the evidence: predicted
      UNSUPPORTED_VALUE (SEV2), same taxonomy gap.

