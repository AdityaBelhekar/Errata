[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "errata-spec"
version = "0.1.0"
description = "The Errata claim schema: immutable evidence-bearing claims, abstentions, redlines, and the disagreement taxonomy."
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "The Errata Authors" }]

dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
errata_spec = ["policies/*.yaml", "schemas/*.json"]
