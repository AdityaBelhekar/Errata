# Keep the Render free instance awake.
#
# Render's free plan spins a web service down after 15 minutes with no inbound request, and the
# cold start that follows takes roughly 50 seconds. For a judged demo that is the actual risk --
# not that the service is broken, but that the first person to open the link waits a minute in
# front of a blank tab and moves on.
#
# This pings it every 10 minutes, inside that 15-minute window.
#
# THREE HONEST CAVEATS
#
# 1. GitHub's scheduled runners are best-effort. `*/10` is a request, not a guarantee -- runs are
#    routinely 5-15 minutes late under load, which can miss the window. If demo day matters, put
#    a real uptime monitor on it as well (cron-job.org and UptimeRobot both do 5-minute checks on
#    a free tier) and treat this workflow as the backup.
#
# 2. GitHub disables scheduled workflows in a repository with no activity for 60 days.
#
# 3. A free instance kept awake around the clock consumes about 730 of the 750 free instance-hours
#    per month, so this uses nearly the whole allowance on one service. That is within the plan,
#    but it is worth knowing rather than discovering. If this outlives the hackathon, the honest
#    fix is the paid instance, which has no spin-down and needs none of this.

name: keepalive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: ping the console
    runs-on: ubuntu-latest
    steps:
      - name: wake it
        run: |
          URL="https://token-wasters-errata.onrender.com/"

          # --max-time 120, not the default: a request that arrives during a cold start IS the
          # wake-up, and it legitimately blocks for ~50s while the instance boots. Timing out at
          # 10s would report failure for the one case this workflow exists to handle.
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 --retry 2 --retry-delay 15 "$URL" || echo 000)"

          echo "GET $URL -> $code"

          # 2xx and 3xx are both awake. Anything else is worth a red run: a keepalive that is
          # green while the service is down is not a monitor, it is a cron job with a curl in it.
          case "$code" in
            2*|3*) echo "awake" ;;
            000)   echo "::error::no response within 120s -- service may be down"; exit 1 ;;
            *)     echo "::error::unexpected status $code"; exit 1 ;;
          esac
